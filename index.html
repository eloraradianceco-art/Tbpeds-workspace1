                {[["Current", "10", "clients/mo"], ["Target", "40", "clients/mo"], ["Conditions", "15", "treated"], ["Social Posts", "20", "ready now"], ["Video Topics", "20", "planned"]].map(([label, val, sub]) => (
                  <div key={label} style={{ textAlign: "center" }}>
                    <div style={{ fontSize: 11, color: "#7a9ab0", letterSpacing: 1 }}>{label}</div>
                    <div style={{ fontSize: 32, fontWeight: 700, color: "#2A8C8C", lineHeight: 1 }}>{val}</div>
                    <div style={{ fontSize: 11, color: "#7a9ab0" }}>{sub}</div>
                  </div>
                ))}
              </div>
            </Card>
          </div>
        )}

        {/* ── CONDITIONS ── */}
        {activeTab === 1 && (
          <div>
            <p style={{ color: "#7a9ab0", fontSize: 14, marginBottom: 20, marginTop: 0 }}>Click any condition to expand both therapists' roles. Use these breakdowns for patient education, social content, and referral conversations.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {CONDITIONS.map((c, i) => (
                <div key={i} style={{ background: expandedCondition === i ? "rgba(42,140,140,0.1)" : "rgba(255,255,255,0.03)", border: `1px solid ${expandedCondition === i ? "rgba(42,140,140,0.4)" : "rgba(255,255,255,0.07)"}`, borderRadius: 12, overflow: "hidden", transition: "all 0.2s", cursor: "pointer" }} onClick={() => setExpandedCondition(expandedCondition === i ? null : i)}>
                  <div style={{ padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                      <span style={{ fontSize: 20 }}>{c.icon}</span>
                      <span style={{ fontWeight: 700, fontSize: 15 }}>{c.name}</span>
                    </div>
                    <span style={{ color: "#2A8C8C", fontSize: 18 }}>{expandedCondition === i ? "−" : "+"}</span>
                  </div>
                  {expandedCondition === i && (
                    <div style={{ padding: "0 20px 20px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
                      <div style={{ background: "rgba(28,43,57,0.6)", borderRadius: 8, padding: 16 }}>
                        <div style={{ fontSize: 11, color: "#2A8C8C", letterSpacing: 2, marginBottom: 8, fontFamily: "monospace" }}>ANTHONY — MFR</div>
                        <div style={{ fontSize: 13, color: "#c0d4e0", lineHeight: 1.7 }}>{c.anthony}</div>
                      </div>
                      <div style={{ background: "rgba(28,43,57,0.6)", borderRadius: 8, padding: 16 }}>
                        <div style={{ fontSize: 11, color: "#68B5B8", letterSpacing: 2, marginBottom: 8, fontFamily: "monospace" }}>COURTNEY — MFT</div>
                        <div style={{ fontSize: 13, color: "#c0d4e0", lineHeight: 1.7 }}>{c.courtney}</div>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── PHILOSOPHIES ── */}
        {activeTab === 2 && (
          <div>
            <p style={{ color: "#7a9ab0", fontSize: 14, marginBottom: 20, marginTop: 0 }}>Your shared philosophy is the foundation of your brand story. Use these points for bios, website copy, and patient consultations.</p>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 24 }}>
              {PHILOSOPHIES.map((p, i) => (
                <Card key={i} style={{ borderTop: `3px solid ${p.accent}` }}>
                  <div style={{ fontSize: 12, color: p.accent, letterSpacing: 2, marginBottom: 12, fontFamily: "monospace" }}>{p.label.toUpperCase()}</div>
                  {p.points.map((pt, j) => (
                    <div key={j} style={{ display: "flex", gap: 10, padding: "8px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                      <span style={{ color: p.accent, fontSize: 12, marginTop: 2 }}>◆</span>
                      <span style={{ fontSize: 13, color: "#c0d4e0", lineHeight: 1.6 }}>{pt}</span>
                    </div>
                  ))}
                </Card>
              ))}
            </div>
            <Card>
              <div style={{ fontSize: 11, letterSpacing: 2, color: "#2A8C8C", marginBottom: 12, fontFamily: "monospace" }}>WHERE YOUR PHILOSOPHIES CONVERGE</div>
              {[
                ["Structure precedes function", "Anthony releases the tissue so Courtney can retrain the movement — without fascial restriction, motor re-education is fighting an uphill battle."],
                ["Root cause over symptom management", "Both modalities ask WHY the dysfunction exists, not just how to suppress it."],
                ["The body is one integrated system", "A tongue tie affects the jaw, the neck, the cranium, the diaphragm, and beyond. Both of you treat the chain, not the link."],
                ["Patient education accelerates outcomes", "Families who understand the 'why' comply with home programs and make faster progress."],
              ].map(([title, desc], i) => (
                <div key={i} style={{ padding: "12px 0", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                  <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>{title}</div>
                  <div style={{ fontSize: 13, color: "#8aacbd", lineHeight: 1.6 }}>{desc}</div>
                </div>
              ))}
            </Card>
          </div>
        )}

        {/* ── SOCIAL CONTENT ── */}
        {activeTab === 3 && (
          <div>
            <div style={{ display: "flex", gap: 8, marginBottom: 20, flexWrap: "wrap" }}>
              {categories.map(cat => (
                <button key={cat} onClick={() => setFilterCat(cat)} style={{ padding: "6px 14px", borderRadius: 20, border: "none", cursor: "pointer", fontSize: 12, fontFamily: "inherit", fontWeight: filterCat === cat ? 700 : 400, background: filterCat === cat ? "#2A8C8C" : "rgba(255,255,255,0.07)", color: filterCat === cat ? "#fff" : "#7a9ab0", transition: "all 0.2s" }}>
                  {cat}
                </button>
              ))}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {filteredPosts.map((post, i) => (
                <div key={i} style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 14, overflow: "hidden" }}>
                  <div style={{ padding: "14px 18px", display: "flex", justifyContent: "space-between", alignItems: "flex-start", cursor: "pointer" }} onClick={() => setExpandedPost(expandedPost === i ? null : i)}>
                    <div>
                      <div style={{ display: "flex", gap: 8, marginBottom: 6, alignItems: "center" }}>
                        <span style={{ fontSize: 11, background: "rgba(42,140,140,0.15)", color: "#2A8C8C", padding: "2px 8px", borderRadius: 10, fontFamily: "monospace", letterSpacing: 1 }}>{post.category}</span>
                        <span style={{ fontSize: 11, color: "#5a7a90", fontStyle: "italic" }}>{post.platform}</span>
                      </div>
                      <div style={{ fontWeight: 700, fontSize: 15 }}>{post.title}</div>
                      <div style={{ fontSize: 13, color: "#7a9ab0", marginTop: 4, fontStyle: "italic" }}>"{post.hook}"</div>
                    </div>
                    <span style={{ color: "#2A8C8C", fontSize: 18, marginLeft: 12 }}>{expandedPost === i ? "−" : "+"}</span>
                  </div>
                  {expandedPost === i && (
                    <div style={{ padding: "0 18px 18px" }}>
                      <div style={{ background: "rgba(0,0,0,0.2)", borderRadius: 10, padding: 16, marginBottom: 12, fontSize: 13, color: "#c0d4e0", lineHeight: 1.8, whiteSpace: "pre-line" }}>
                        <em style={{ color: "#7a9ab0", fontSize: 12 }}>Hook:</em> {post.hook}<br /><br />
                        {post.body}
                      </div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 12 }}>
                        {post.tags.split(" ").map(t => <Tag key={t} text={t} />)}
                      </div>
                      <button onClick={() => copyToClipboard(`${post.hook}\n\n${post.body}\n\n${post.tags}`, i)} style={{ padding: "8px 18px", background: copied === i ? "#2A8C8C" : "rgba(42,140,140,0.15)", color: copied === i ? "#fff" : "#2A8C8C", border: "1px solid #2A8C8C", borderRadius: 8, cursor: "pointer", fontSize: 12, fontFamily: "inherit", fontWeight: 700, transition: "all 0.2s" }}>
                        {copied === i ? "✓ Copied!" : "Copy Caption"}
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        {/* ── VIDEO LIBRARY ── */}
        {activeTab === 4 && (
          <div>
            <p style={{ color: "#7a9ab0", fontSize: 14, marginBottom: 20, marginTop: 0 }}>20 video topics planned. Paste a YouTube video ID into the <code style={{ background: "rgba(255,255,255,0.08)", padding: "1px 6px", borderRadius: 4, fontSize: 12 }}>url</code> field for any title to make it go live. Add 1–2 per month as you film.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {VIDEOS.map((v, i) => (
                <Card key={i} style={{ padding: "14px 18px" }}>
                  {v.url ? (
                    <>
                      <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>{v.title}</div>
                      <div style={{ borderRadius: 8, overflow: "hidden", background: "#000", aspectRatio: "16/9" }}>
                        <iframe width="100%" height="100%" src={`https://www.youtube.com/embed/${v.url}`} title={v.title} frameBorder="0" allowFullScreen style={{ display: "block" }} />
                      </div>
                    </>
                  ) : (
                    <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                      <div style={{ width: 32, height: 32, borderRadius: 8, background: "rgba(42,140,140,0.12)", border: "1px dashed rgba(42,140,140,0.35)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        <span style={{ fontSize: 12, color: "#2A8C8C" }}>▶</span>
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 13, color: "#c0d4e0", fontWeight: 600 }}>{v.title}</div>
                        <div style={{ fontSize: 11, color: "#4a6a80", marginTop: 2 }}>Pending — add YouTube ID to go live</div>
                      </div>
                      <div style={{ fontSize: 11, color: "#2a4a5a", background: "rgba(42,140,140,0.07)", padding: "2px 8px", borderRadius: 8 }}>#{i + 1}</div>
                    </div>
                  )}
                </Card>
              ))}
            </div>
          </div>
        )}

        {/* ── TESTIMONIES ── */}
        {activeTab === 5 && (
          <div>
            <p style={{ color: "#7a9ab0", fontSize: 14, marginBottom: 20, marginTop: 0 }}>Placeholder testimonies to model the format. Replace with real parent feedback as it comes in — great for social proof, website copy, and patient consultations.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              {TESTIMONIES.map((t, i) => (
                <Card key={i} style={{ borderLeft: "3px solid #2A8C8C", position: "relative" }}>
                  {t.placeholder && (
                    <div style={{ position: "absolute", top: 12, right: 16, fontSize: 10, color: "#4a6a80", background: "rgba(255,255,255,0.05)", padding: "2px 8px", borderRadius: 10, letterSpacing: 1 }}>SAMPLE</div>
                  )}
                  <div style={{ display: "flex", gap: 4, marginBottom: 10 }}>
                    {Array.from({ length: t.stars }).map((_, s) => (
                      <span key={s} style={{ color: "#f5c842", fontSize: 14 }}>★</span>
                    ))}
                  </div>
                  <div style={{ fontSize: 15, color: "#d0e4f0", lineHeight: 1.75, fontStyle: "italic", marginBottom: 14 }}>"{t.quote}"</div>
                  <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
                    <div style={{ width: 36, height: 36, borderRadius: "50%", background: "linear-gradient(135deg, #2A8C8C, #1C2B39)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: 700, color: "#fff" }}>
                      {t.name.charAt(0)}
                    </div>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: 13 }}>{t.name}</div>
                      <div style={{ fontSize: 12, color: "#7a9ab0" }}>{t.child}</div>
                    </div>
                  </div>
                </Card>
              ))}
              <Card style={{ border: "2px dashed rgba(42,140,140,0.25)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 28, textAlign: "center" }}>
                <div style={{ fontSize: 28, color: "#2A8C8C", marginBottom: 8 }}>+</div>
                <div style={{ fontSize: 13, color: "#7a9ab0", fontWeight: 700 }}>Add a real testimony</div>
                <div style={{ fontSize: 12, color: "#4a6a80", marginTop: 4 }}>Paste parent feedback into the TESTIMONIES array in the source</div>
              </Card>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
